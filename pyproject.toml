[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scrapmem"
version = "0.2.0"
description = "Daily visual memory, episodic graph retrieval, and optical forgetting"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [{name = "Jiale Chang"}, {name = "Yuxiang Ren"}]
dependencies = ["numpy>=1.24,<3", "Pillow>=10.4,<13"]

[project.optional-dependencies]
models = ["sentence-transformers>=3,<6"]
vision = ["transformers>=4.57,<6", "torch>=2.2,<3", "accelerate>=1,<2"]

quantization = ["bitsandbytes>=0.45,<1"]

[project.scripts]
scrapmem = "scrapmem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"scrapmem._vendor.atmbench" = ["LICENSE", "PROVENANCE.json"]
